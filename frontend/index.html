<!doctype html>
<html lang="id" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Force-clear stale mobile/in-app browser caches before Vue mounts -->
    <script>
      (function () {
        try {
          var targetV = '20261126_2';
          if (localStorage.getItem('roja_v') !== targetV) {
            var adminToken = localStorage.getItem('admin_token');
            localStorage.clear();
            if (adminToken) {
              localStorage.setItem('admin_token', adminToken);
            }
            localStorage.setItem('roja_v', targetV);
            if ('caches' in window) {
              caches.keys().then(function (names) {
                names.forEach(function (name) {
                  caches.delete(name);
                });
              });
            }
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                regs.forEach(function (reg) {
                  reg.unregister();
                });
              });
            }
            window.location.reload();
          }
        } catch (e) {}
      })();
    </script>

    <!-- Primary Meta Tags -->
    <title>Panitia Rojabiyyah &amp; Haul Abah Ke-5</title>
